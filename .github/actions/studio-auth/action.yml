name: Studio agent auth lifecycle
description: >-
  Restore/persist/cleanup encrypted Codex auth. Read tokens are
  created and revoked by the caller around the clone; write tokens only
  after the agent ran and only when auth changed. Agent steps must never
  receive passphrases, private keys or repo tokens.
inputs:
  mode:
    description: "restore-codex | persist-codex | push-codex | cleanup"
    required: true
outputs:
  changed:
    description: "true when persist re-encrypted changed auth (write token only then)"
    value: ${{ steps.auth.outputs.changed }}
runs:
  using: composite
  steps:
    - name: Run auth lifecycle script
      id: auth
      shell: bash
      env:
        STUDIO_AUTH_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$STUDIO_AUTH_MODE" in
          restore-codex) bash .github/studio/scripts/auth-restore.sh codex ;;
          persist-codex) bash .github/studio/scripts/auth-persist.sh codex ;;
          push-codex)    bash .github/studio/scripts/auth-push.sh codex ;;
          cleanup)       bash .github/studio/scripts/auth-cleanup.sh ;;
          *) echo "unknown mode: $STUDIO_AUTH_MODE" >&2; exit 2 ;;
        esac
