name: Studio source recording
description: 本人演奏とおおまかな希望から、最大3案の映像作品を制作します（ownerのみ）
title: "Studio: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        切り取る前の本人演奏を1件添付し、下におおまかな希望を書いてください。
        このリポジトリは公開されているため、添付も公開されます。
        Issue作成後、Codexへ「Issue #番号 の映像作品化をお願いします」と依頼します。
        抜粋は60–120秒から自動選定し、最大3案のPRで比較します。
        秒指定・カット割り・エフェクト同期を手作業で行う必要はありません。
  - type: textarea
    id: attachment
    attributes:
      label: Recording attachment (required)
      description: Drag the file here so GitHub creates a user-attachment URL.
    validations:
      required: true
  - type: input
    id: piece
    attributes:
      label: Piece (optional, unknown by default)
      description: Free text only; the studio never identifies the recording for you.
    validations:
      required: false
  - type: dropdown
    id: period
    attributes:
      label: Period direction (optional creative direction, not fact)
      options:
        - unknown
        - early (aspiration for professional performance)
        - middle (concert presence + expressiveness)
        - late (healing)
    validations:
      required: false
  - type: textarea
    id: art_notes
    attributes:
      label: Art / direction notes (optional)
    validations:
      required: false
