name: Studio production

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Legacy saved source issue (owner only; new works use Studio candidate)"
        required: true
        type: number

permissions: {}

# Shared across ALL studio jobs (auth repos are single-writer). Never add a
# second nested concurrency group in jobs: that deadlocks against this one.
concurrency:
  group: studio-agent-auth
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    if: github.actor == 'YusukeIwaki' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    name: Preflight (owner intake)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      proceed: ${{ steps.intake.outputs.proceed }}
      issue_number: ${{ steps.intake.outputs.issue_number }}
      attachment_url: ${{ steps.intake.outputs.attachment_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate owner intake and attachment
        id: intake
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER_EVENT: ${{ github.event.issue.number }}
          ISSUE_NUMBER_INPUT: ${{ inputs.issue_number }}
          EVENT_SENDER: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then num="$ISSUE_NUMBER_INPUT"; else num="$ISSUE_NUMBER_EVENT"; fi
          # Always re-validate the source-issue AUTHOR via the API, in both paths.
          author="$(gh api "/repos/${REPO}/issues/${num}" --jq .user.login)"
          state="$(gh api "/repos/${REPO}/issues/${num}" --jq .state)"
          body="$(gh api "/repos/${REPO}/issues/${num}" --jq .body)"
          printf '%s' "$body" > "$RUNNER_TEMP/issue-body.md"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 -m studio intake --author "$author" --state "$state" --dispatch-actor "$EVENT_SENDER" \
              || { echo "proceed=false" >> "$GITHUB_OUTPUT"; echo "issue_number=$num" >> "$GITHUB_OUTPUT"; echo "attachment_url=" >> "$GITHUB_OUTPUT"; echo "Intake skipped: dispatch requires owner operator and owner-authored open issue." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          else
            ISSUE_AUTHOR_EVENT="${{ github.event.issue.user.login }}"
            ISSUE_STATE_EVENT="${{ github.event.issue.state }}"
            python3 -m studio intake --author "$author" --sender "$EVENT_SENDER" --state "$state" \
              || { echo "proceed=false" >> "$GITHUB_OUTPUT"; echo "issue_number=$num" >> "$GITHUB_OUTPUT"; echo "attachment_url=" >> "$GITHUB_OUTPUT"; echo "Intake skipped: not an owner/open source issue." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          fi
          ISSUE_BODY_FILE="$RUNNER_TEMP/issue-body.md" ISSUE_NUM="$num" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from pathlib import Path
          from studio import validate
          body = Path(os.environ["ISSUE_BODY_FILE"]).read_text(encoding="utf-8")
          urls = [u for u in validate.extract_attachment_urls(body)
                  if validate.validate_attachment_url(u)["ok"]]
          print(f"issue_number={os.environ['ISSUE_NUM']}")
          if len(urls) != 1:
              print("proceed=false")
              print("attachment_url=")
          else:
              print("proceed=true")
              print(f"attachment_url={urls[0]}")
          PY
          if ! grep -q "proceed=true" "$GITHUB_OUTPUT"; then
            echo "Intake skipped gracefully: exactly one GitHub attachment is required." >> "$GITHUB_STEP_SUMMARY"
          fi

  plan:
    name: Load Codex-authored production project
    needs: preflight
    if: needs.preflight.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      matrix: ${{ steps.project.outputs.matrix }}
      fingerprint: ${{ steps.project.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate saved project and existing issue links
        id: project
        env:
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          ATTACHMENT_URL: ${{ needs.preflight.outputs.attachment_url }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/studio_prepare_project.py --issue "$ISSUE_NUMBER" --url "$ATTACHMENT_URL" --out output/studio/plan
      - name: Upload production inputs (no source audio)
        uses: actions/upload-artifact@v7
        with:
          name: studio-plan-issue-${{ needs.preflight.outputs.issue_number }}
          path: output/studio/plan/
          retention-days: 90

  build:
    name: Build candidate
    needs: [preflight, plan]
    if: needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    # Bounded review and deterministic rendering of the saved project.
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out main (trusted code only; PR branch is JSON-only via API)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set runtime paths
        run: |
          {
            echo "CODEX_RUNTIME_HOME=$RUNNER_TEMP/codex-home"
            echo "CODEX_ENC_REPO_DIR=$RUNNER_TEMP/codex-enc-repository"
            echo "CODEX_AUTH_BEFORE_HASH=$RUNNER_TEMP/codex-auth-before.sha256"
            echo "STUDIO_SOURCE_DIR=$PWD/output/studio/source"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install ffmpeg and Codex review tools (latest)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          pip install -r requirements-p0.txt
          npm install --global "@openai/codex@latest"
          codex --version
          bash .github/studio/scripts/setup-codex-sandbox.sh
          npm install --prefix "$RUNNER_TEMP/studio-artifact-tools" --ignore-scripts --no-audit --no-fund @actions/artifact@2.3.2
          echo "STUDIO_ARTIFACT_TOOLS=$RUNNER_TEMP/studio-artifact-tools" >> "$GITHUB_ENV"
      - name: Download plan bundle
        uses: actions/download-artifact@v7
        with:
          name: studio-plan-issue-${{ needs.preflight.outputs.issue_number }}
          path: output/studio/plan
      - name: Load saved brief and storyboard
        run: |
          mkdir -p output/studio/work
          cp output/studio/plan/{brief,candidate,scenes,storyboard}.json output/studio/work/
      - name: Download source and verify both hashes
        env:
          ATTACHMENT_URL: ${{ needs.preflight.outputs.attachment_url }}
        run: |
          set -euo pipefail
          mkdir -p output/studio/source
          python3 scripts/studio_download.py --url "$ATTACHMENT_URL" --out output/studio/source/source.bin --meta-out output/studio/work/source-meta.json --decode-out output/studio/source/source.wav
          python3 - <<'PY'
          import json
          plan_meta = json.load(open("output/studio/plan/source-meta.json"))
          work_meta = json.load(open("output/studio/work/source-meta.json"))
          assert work_meta["attachment_sha256"] == plan_meta["attachment_sha256"], "attachment hash changed since planning"
          assert work_meta["decoded_wav_sha256"] == plan_meta["decoded_wav_sha256"], "decoded WAV hash does not match plan context"
          print("source hashes verified (attachment + decoded)")
          PY
      - name: Create Codex read token (review)
        id: codex_read
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CODEX_ENC_APP_ID }}
          private-key: ${{ secrets.CODEX_ENC_APP_PRIVATE_KEY }}
          owner: YusukeIwaki
          repositories: codex.enc
          permission-contents: read
          skip-token-revoke: true
      - name: Clone Codex auth (review)
        env:
          GH_TOKEN: ${{ steps.codex_read.outputs.token }}
        run: |
          gh auth setup-git
          git clone --branch main --single-branch https://github.com/YusukeIwaki/codex.enc.git "$CODEX_ENC_REPO_DIR"
          test -s "$CODEX_ENC_REPO_DIR/codex.enc"
      - name: Revoke Codex read token (review)
        if: always() && steps.codex_read.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.codex_read.outputs.token }}
        run: gh api --method DELETE /installation/token
      - name: Restore Codex auth (review)
        id: restore_codex
        uses: ./.github/actions/studio-auth
        with:
          mode: restore-codex
        env:
          CODEX_ENC_PASSPHRASE: ${{ secrets.CODEX_ENC_PASSPHRASE }}
      - name: Staged visual preflight (still to motion)
        id: visual
        # One still review and one motion review; content changes stay in Codex.
        timeout-minutes: 40
        uses: actions/github-script@v8
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PARENT_ISSUE: ${{ needs.preflight.outputs.issue_number }}
          CHILD_ISSUE: ${{ matrix.child_issue }}
          ENGINE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          VISUAL_WORK: output/studio/work
          VISUAL_WAV: output/studio/source/source.wav
        with:
          script: |
            await exec.exec('python3', ['scripts/studio_visual_preflight.py', '--work', process.env.VISUAL_WORK, '--codex-led', '--wav', process.env.VISUAL_WAV, '--parent', process.env.PARENT_ISSUE, '--child', process.env.CHILD_ISSUE, '--engine-sha', process.env.ENGINE_SHA, '--run-id', process.env.RUN_ID, '--run-attempt', process.env.RUN_ATTEMPT]);
      - name: Validate storyboard and render (trusted renderer + encoded QA)
        if: steps.visual.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          python3 -m studio validate-storyboard --storyboard output/studio/work/storyboard.json --scenes output/studio/work/scenes.json
          python3 scripts/studio_render.py --wav output/studio/source/source.wav --candidate output/studio/work/candidate.json --storyboard output/studio/work/storyboard.json --brief output/studio/work/brief.json --out output/studio/work/bundle --visual-approval output/studio/work/visual-approval.json --engine-sha ${{ github.sha }}
      - name: Commit production bundle and create or reuse PR
        if: steps.visual.outputs.proceed == 'true'
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CHILD_ISSUE: ${{ matrix.child_issue }}
        run: |
          set -euo pipefail
          mkdir -p output/studio/work/production-bundle
          cp output/studio/work/brief.json output/studio/work/storyboard.json output/studio/work/bundle/plan.json output/studio/work/bundle/qa.json output/studio/work/bundle/provenance.json output/studio/work/bundle/timeline.json output/studio/work/production-bundle/
          python3 scripts/studio_commit_bundle.py --child "$CHILD_ISSUE" --bundle-dir output/studio/work/production-bundle --out output/studio/work/pr.json
          echo "pr_number=$(python3 -c 'import json;print(json.load(open("output/studio/work/pr.json"))["pr_number"])')" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(python3 -c 'import json;print(json.load(open("output/studio/work/pr.json"))["head_sha"])')" >> "$GITHUB_OUTPUT"
      - name: Generate artifact receipt and hash manifest (receipt not committed)
        if: steps.visual.outputs.proceed == 'true'
        env:
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          PR_NUMBER: ${{ steps.commit.outputs.pr_number }}
          CHILD_ISSUE: ${{ matrix.child_issue }}
          PARENT_ISSUE: ${{ needs.preflight.outputs.issue_number }}
          FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
        run: |
          set -euo pipefail
          python3 -c 'import json; json.dump(json.load(open("output/studio/work/pr.json"))["blob_sha256"], open("output/studio/work/production-map.json","w"), indent=2)'
          python3 -m studio make-receipt --pr "$PR_NUMBER" --child "$CHILD_ISSUE" --parent "$PARENT_ISSUE" --head-sha "$HEAD_SHA" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --engine-sha "${{ github.sha }}" --attachment-sha256 "$(python3 -c 'import json;print(json.load(open("output/studio/work/source-meta.json"))["attachment_sha256"])')" --decoded-sha256 "$(python3 -c 'import json;print(json.load(open("output/studio/work/source-meta.json"))["decoded_wav_sha256"])')" --fingerprint "$FINGERPRINT" --production-map output/studio/work/production-map.json --out output/studio/work/bundle/receipt.json
          cp output/studio/work/storyboard.json output/studio/work/brief.json output/studio/work/bundle/
          python3 - <<'PY'
          import json
          from pathlib import Path
          from studio import artifacts
          d = Path("output/studio/work/bundle")
          files = {p.name: p.read_bytes() for p in d.iterdir() if p.is_file() and p.name != "hashes.json"}
          (d / "hashes.json").write_text(json.dumps(artifacts.build_hash_manifest(files), indent=2))
          PY
      - name: Run Codex evidence review (labelled brief/storyboard/files/images/QA)
        if: steps.visual.outputs.proceed == 'true'
        timeout-minutes: 15
        env:
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set +e
          { cat .github/studio/prompts/codex-review.md; echo; echo "Expected head SHA: $HEAD_SHA"; echo '## 1 SOURCE BRIEF brief.json'; cat output/studio/work/brief.json; echo '## 2 STORYBOARD storyboard.json'; cat output/studio/work/storyboard.json; echo '## 3 PRODUCTION FILES (committed digests)'; cat output/studio/work/pr.json; echo '## 4 PLAN plan.json'; cat output/studio/work/bundle/plan.json; echo '## 4 QA qa.json'; cat output/studio/work/bundle/qa.json; echo '## 5 HASHES hashes.json'; cat output/studio/work/bundle/hashes.json; echo '## PROVENANCE provenance.json'; cat output/studio/work/bundle/provenance.json; echo '## RECEIPT receipt.json'; cat output/studio/work/bundle/receipt.json; } > "$RUNNER_TEMP/review-prompt.md"
          CODEX_HOME="$CODEX_RUNTIME_HOME" codex --ask-for-approval never exec --strict-config --ephemeral --model gpt-6.1-sol --config 'model_reasoning_effort="xhigh"' --config 'default_permissions="studio"' --image output/studio/work/bundle/contact-sheet.jpg --output-schema .github/studio/schemas/review.schema.json --output-last-message output/studio/work/bundle/review.json - < "$RUNNER_TEMP/review-prompt.md" > "$RUNNER_TEMP/codex.stdout" 2> "$RUNNER_TEMP/codex.stderr"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then python3 .github/studio/scripts/report-agent-error.py "$RUNNER_TEMP/codex.stderr" || true; echo "::error::Codex reviewer failed with exit $code" >&2; exit "$code"; fi
          test -s output/studio/work/bundle/review.json
          python3 -m studio check-review --review output/studio/work/bundle/review.json --head-sha "$HEAD_SHA" --mechanical-pass || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          from studio import artifacts
          d = Path("output/studio/work/bundle")
          files = {p.name: p.read_bytes() for p in d.iterdir() if p.is_file() and p.name != "hashes.json"}
          (d / "hashes.json").write_text(json.dumps(artifacts.build_hash_manifest(files), indent=2))
          PY
      - name: Validate bundle allowlist before upload
        if: steps.visual.outputs.proceed == 'true'
        run: |
          python3 -m studio check-bundle --dir output/studio/work/bundle
      - name: Upload production artifact (child/head/run/attempt in name)
        if: steps.visual.outputs.proceed == 'true'
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: studio-child-${{ matrix.child_issue }}-pr-${{ steps.commit.outputs.pr_number }}-${{ steps.commit.outputs.head_sha }}-run-${{ github.run_id }}-a${{ github.run_attempt }}
          path: output/studio/work/bundle/
          retention-days: 90
      - name: Build aggregate visual history
        id: validate_visual_history
        if: always() && hashFiles('output/studio/work/visual-state.json') != ''
        run: |
          set -euo pipefail
          python3 scripts/studio_visual_preflight.py --work output/studio/work --validate-history
      - name: Upload aggregate visual history (not release-eligible)
        if: always() && steps.validate_visual_history.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: studio-visual-reviews-child-${{ matrix.child_issue }}-run-${{ github.run_id }}-a${{ github.run_attempt }}
          path: output/studio/work/visual-history/
          retention-days: 90
      - name: Publish review (ping only on pass + mechanical pass; retry-safe)
        if: steps.visual.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.commit.outputs.pr_number }}
          CHILD_ISSUE: ${{ matrix.child_issue }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mech=""
          python3 -c 'import json,sys; sys.exit(0 if json.load(open("output/studio/work/bundle/qa.json"))["pass"] else 1)' && mech="--mechanical-pass" || true
          python3 scripts/studio_publish_review.py --review output/studio/work/bundle/review.json --pr "$PR_NUMBER" --child "$CHILD_ISSUE" --head-sha "$HEAD_SHA" --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" --artifact-id "$ARTIFACT_ID" --artifact-url "$ARTIFACT_URL" $mech
      - name: Summarize reviewed production
        if: steps.visual.outputs.proceed == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          d = Path("output/studio/work")
          review = json.loads((d / "bundle/review.json").read_text())
          qa = json.loads((d / "bundle/qa.json").read_text())
          head = json.loads((d / "pr.json").read_text())["head_sha"]
          print(f"Final review: {review['verdict']}; mechanical QA: {qa['pass']}")
          print(f"Reviewed production head: {head}")
          print("The owner's merge selects the video for release; no separate Approve is required. Failed quality reviews return to the Codex production session.")
          PY
      - name: Summarize early visual block
        if: always() && steps.visual.outputs.proceed == 'false'
        env:
          VISUAL_STATUS: ${{ steps.visual.outputs.status }}
        run: |
          {
            echo "## Studio final quality status: visual preflight blocked (${VISUAL_STATUS})"
            echo "- owner-ready: NO"
            echo "- new production head: none (no new production head was created and no full render ran)"
            echo "- next action: address the visual preflight outcome above; do not treat this workflow as a quality pass"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Persist refreshed Codex auth
        id: persist_codex
        if: always() && steps.restore_codex.outcome == 'success'
        uses: ./.github/actions/studio-auth
        with:
          mode: persist-codex
        env:
          CODEX_ENC_PASSPHRASE: ${{ secrets.CODEX_ENC_PASSPHRASE }}
      - name: Create Codex write token (only when auth changed)
        id: codex_write
        if: always() && steps.persist_codex.outcome == 'success' && steps.persist_codex.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CODEX_ENC_APP_ID }}
          private-key: ${{ secrets.CODEX_ENC_APP_PRIVATE_KEY }}
          owner: YusukeIwaki
          repositories: codex.enc
          permission-contents: write
      - name: Push refreshed Codex auth (only when changed)
        if: always() && steps.persist_codex.outputs.changed == 'true' && steps.codex_write.outcome == 'success'
        uses: ./.github/actions/studio-auth
        with:
          mode: push-codex
        env:
          GH_TOKEN: ${{ steps.codex_write.outputs.token }}
      - name: Cleanup credentials
        if: always()
        uses: ./.github/actions/studio-auth
        with:
          mode: cleanup
