name: Studio auth smoke

# Owner-only manual smoke: exact production models answer a minimal OK
# prompt. No Issue/PR/Release mutations; only the encrypted-auth repos
# may be updated (changed-gated, same lifecycle as production).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-agent-auth
  queue: max
  cancel-in-progress: false

jobs:
  smoke:
    name: Auth smoke (Codex exact model)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Require owner operator
        env:
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$ACTOR" != "YusukeIwaki" ]; then echo "::error::auth smoke is owner-only" >&2; exit 1; fi
      - name: Check out trusted dispatched revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set runtime paths
        run: |
          {
            echo "CODEX_RUNTIME_HOME=$RUNNER_TEMP/codex-home"
            echo "CODEX_ENC_REPO_DIR=$RUNNER_TEMP/codex-enc-repository"
            echo "CODEX_AUTH_BEFORE_HASH=$RUNNER_TEMP/codex-auth-before.sha256"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Codex (latest)
        run: |
          set -euo pipefail
          npm install --global "@openai/codex@latest"
          codex --version
          bash .github/studio/scripts/setup-codex-sandbox.sh
      - name: Create Codex read token
        id: codex_read
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CODEX_ENC_APP_ID }}
          private-key: ${{ secrets.CODEX_ENC_APP_PRIVATE_KEY }}
          owner: YusukeIwaki
          repositories: codex.enc
          permission-contents: read
          skip-token-revoke: true
      - name: Clone encrypted Codex auth
        env:
          GH_TOKEN: ${{ steps.codex_read.outputs.token }}
        run: |
          gh auth setup-git
          git clone --branch main --single-branch https://github.com/YusukeIwaki/codex.enc.git "$CODEX_ENC_REPO_DIR"
          test -s "$CODEX_ENC_REPO_DIR/codex.enc"
      - name: Revoke Codex read token
        if: always() && steps.codex_read.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.codex_read.outputs.token }}
        run: gh api --method DELETE /installation/token
      - name: Restore Codex auth
        id: restore_codex
        uses: ./.github/actions/studio-auth
        with:
          mode: restore-codex
        env:
          CODEX_ENC_PASSPHRASE: ${{ secrets.CODEX_ENC_PASSPHRASE }}
      - name: Codex minimal prompt (exact model, xhigh)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          printf 'Reply with exactly: OK\n' > "$RUNNER_TEMP/smoke/prompt.md"
          CODEX_HOME="$CODEX_RUNTIME_HOME" codex --ask-for-approval never exec --strict-config --ephemeral --model gpt-6.1-sol --config 'model_reasoning_effort="xhigh"' --config 'default_permissions="studio"' --output-last-message "$RUNNER_TEMP/smoke/codex.txt" - < "$RUNNER_TEMP/smoke/prompt.md"
          test "$(cat "$RUNNER_TEMP/smoke/codex.txt")" = "OK"
      - name: Persist refreshed Codex auth
        id: persist_codex
        if: always() && steps.restore_codex.outcome == 'success'
        uses: ./.github/actions/studio-auth
        with:
          mode: persist-codex
        env:
          CODEX_ENC_PASSPHRASE: ${{ secrets.CODEX_ENC_PASSPHRASE }}
      - name: Create Codex write token (only when changed)
        id: codex_write
        if: always() && steps.persist_codex.outcome == 'success' && steps.persist_codex.outputs.changed == 'true'
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CODEX_ENC_APP_ID }}
          private-key: ${{ secrets.CODEX_ENC_APP_PRIVATE_KEY }}
          owner: YusukeIwaki
          repositories: codex.enc
          permission-contents: write
      - name: Push refreshed Codex auth (only when changed)
        if: always() && steps.persist_codex.outputs.changed == 'true' && steps.codex_write.outcome == 'success'
        uses: ./.github/actions/studio-auth
        with:
          mode: push-codex
        env:
          GH_TOKEN: ${{ steps.codex_write.outputs.token }}
      - name: Cleanup credentials
        if: always()
        uses: ./.github/actions/studio-auth
        with:
          mode: cleanup
